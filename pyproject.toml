[project]
name = "vendor-performance-data-analysis"
version = "1.0.0"
description = "End-to-end DA + BA case study: ~15.6 M rows of retail data analysed with SQLite, Python, and Power BI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "rohitkr8527", email = "rohitkr7518@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.0.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "numpy>=1.26.0",
    "pandas>=3.0.5",
    "reportlab>=4.0.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.54",
]

[project.urls]
Repository = "https://github.com/rohitkr8527/vendor-performance-data-analysis"

[tool.uv]
package = false